<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00CC00">
<meta name="robots" content="noindex, nofollow">

<meta name="apple-mobile-web-app-title" content="PP Feedback">

<title>Pizza Pilgrims München · Feedback</title>
<style>
/* ============================================================
   BRAND — from PP Brand Guidelines v1.0
   ============================================================ */
@font-face{font-family:"PizzaPilgrims"; src:url(fonts/PizzaPilgrims.woff2) format("woff2"); font-display:swap}
@font-face{font-family:"ChelseaRR"; src:url(fonts/ChelseaRR-Light.woff2) format("woff2"); font-weight:300 400; font-display:swap}
@font-face{font-family:"ChelseaRR"; src:url(fonts/ChelseaRR-Bold.woff2) format("woff2"); font-weight:600 800; font-display:swap}
:root{
  --green:#00CC00;      /* Primary · Pantone 802 */
  --dkgreen:#00572E;    /* Secondary · Pantone 3425 */
  --pink:#FB80B7;       /* small doses */
  --blue:#66CCFF;       /* small doses */
  --red:#FF3333;        /* small doses */
  --paper:#FFFFFF;
  --ink:#1A1A1A;
  --muted:#5B6660;
  --line:#DCE8DF;
  --card:#FFFFFF;
  --tint:#E6F9E6;
  --display:"PizzaPilgrims", "Arial Black", Impact, sans-serif;
  --body:"ChelseaRR", Georgia, "Times New Roman", serif;
  --r:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#0E2418; --ink:#F2FFF4; --muted:#A9C2B2; --line:#24412F; --card:#133020; --tint:#1A3D28; }
}
:root[data-theme="dark"]{ --paper:#0E2418; --ink:#F2FFF4; --muted:#A9C2B2; --line:#24412F; --card:#133020; --tint:#1A3D28; }
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:var(--body); font-weight:300; font-size:18px; line-height:1.5; -webkit-font-smoothing:antialiased; text-align:left}
button,input,textarea,select{font:inherit; color:inherit}
b,strong{font-weight:700}
:focus-visible{outline:3px solid var(--dkgreen); outline-offset:2px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

/* Header: bright green, dark green logo */
.top{background:var(--green); padding:14px 20px 16px}
.top-row{display:flex; justify-content:space-between; align-items:center; max-width:560px; margin:0 auto; gap:12px}
.brand{display:flex; align-items:flex-end; gap:10px}
.logo{height:44px; width:auto; display:block}
.place{font-family:var(--body); font-weight:700; color:var(--dkgreen); font-size:16px; line-height:1; padding-bottom:2px}
.lang{display:flex; background:rgba(255,255,255,.35); border-radius:999px; padding:3px}
.lang button{border:0; background:transparent; padding:6px 12px; border-radius:999px; font-weight:700; font-size:14px; color:var(--dkgreen); cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--dkgreen); color:#fff}
.progress{height:6px; background:rgba(0,87,46,.18); border-radius:6px; max-width:560px; margin:14px auto 0; overflow:hidden}
.progress span{display:block; height:100%; background:var(--dkgreen); border-radius:6px; transition:width .35s ease}

.hero{max-width:560px; margin:0 auto; position:relative}
.hero::after{content:""; position:absolute; inset:auto 0 0 0; height:65%; background:linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,0)); pointer-events:none}
.hero h1{position:absolute; left:20px; right:20px; bottom:16px; margin:0; font-size:clamp(28px,8.5vw,40px); color:#fff; z-index:1; text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero img{display:block; width:100%; height:auto; aspect-ratio:3/2; object-fit:cover; object-position:50% 35%}
@media (min-width:600px){ .hero{margin-top:20px; border-radius:var(--r); overflow:hidden} }
main{max-width:560px; margin:0 auto; padding:28px 20px 120px}
/* Headline font: h1 only, short lines, no tracking */
h1{font-family:var(--display); font-weight:400; font-size:clamp(40px,12vw,58px); line-height:.95; margin:0 0 14px; color:var(--dkgreen); letter-spacing:0; text-transform:uppercase}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) h1{color:var(--green)} }
h2{font-family:var(--body); font-weight:700; font-size:26px; line-height:1.15; margin:0 0 12px}
.lede{color:var(--muted); margin:0 0 26px; max-width:44ch}
.qcount{color:var(--muted); font-weight:700; font-size:15px; margin:0 0 6px}

.options{display:grid; gap:10px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px}
.chips .lbl{flex-basis:100%; font-weight:700; font-size:16px}
.chip{padding:9px 16px; border-radius:999px; border:2px solid var(--line); background:var(--card); font-weight:700; font-size:16px; cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--dkgreen); background:var(--tint)}
.opt{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:15px 18px; background:var(--card); border:2px solid var(--line); border-radius:var(--r); cursor:pointer; font-weight:700; transition:border-color .15s, transform .1s}
.opt:active{transform:scale(.985)}
.opt[aria-pressed="true"]{border-color:var(--green); background:var(--tint)}
.opt .sub{display:block; font-weight:300; color:var(--muted); font-size:16px}
.opt .badge{flex:none; width:46px; height:46px; border-radius:50%; background:var(--tint); display:grid; place-items:center; font-size:22px}

.scale{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
.scale.nps{grid-template-columns:repeat(6,1fr)}
.scale button{aspect-ratio:1; border:2px solid var(--line); background:var(--card); border-radius:50%; font-weight:700; font-size:22px; cursor:pointer}
.scale.nps button{font-size:19px; border-radius:14px}
.scale button[aria-pressed="true"]{background:var(--green); border-color:var(--green); color:var(--dkgreen)}
.scale-ends{display:flex; justify-content:space-between; color:var(--muted); font-size:15px; margin-top:10px}

/* Open feedback card */
.postcard{background:var(--card); border:2px solid var(--dkgreen); border-radius:var(--r); padding:18px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .postcard{border-color:var(--green)} }
.postcard label.to{display:block; font-size:16px; color:var(--muted); margin-bottom:8px}
textarea{font-weight:300; width:100%; min-height:150px; resize:vertical; border:2px solid var(--line); border-radius:12px; background:var(--paper); padding:12px 14px; font-size:18px; line-height:1.5}
textarea:focus{outline:none; border-color:var(--green)}
.tools{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.tool{display:flex; align-items:center; justify-content:center; gap:8px; padding:12px 10px; border-radius:999px; border:2px solid var(--dkgreen); background:transparent; color:var(--dkgreen); font-weight:700; font-size:16px; line-height:1.2; cursor:pointer}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tool{border-color:var(--green); color:var(--green)} }
.tool:disabled{opacity:.4}
.tool.rec{background:var(--red); border-color:var(--red); color:#fff}
.tool svg{width:20px; height:20px}
.media{margin-top:14px; display:grid; gap:10px}
.voice{display:flex; align-items:center; gap:10px}
.voice audio{flex:1; height:40px}
.thumbs{display:flex; flex-wrap:wrap; gap:8px}
.thumb{position:relative; width:76px; height:76px; border-radius:10px; overflow:hidden; border:2px solid var(--line); display:block}
.thumb img{width:100%; height:100%; object-fit:cover}
.x{position:absolute; top:3px; right:3px; width:24px; height:24px; border-radius:50%; border:0; background:rgba(0,0,0,.65); color:#fff; font-size:14px; line-height:1; cursor:pointer}
.hint{font-size:15px; color:var(--muted); margin:10px 0 0}

.field{display:grid; gap:6px; margin-bottom:14px}
.field label{font-weight:700; font-size:16px}
.field input,.field select{padding:14px 16px; border:2px solid var(--line); border-radius:14px; background:var(--card); font-size:18px}
.field input:focus{outline:none; border-color:var(--green)}
.check{display:flex; gap:10px; align-items:flex-start; font-size:16px; color:var(--muted)}
.check input{width:22px; height:22px; margin-top:2px; accent-color:var(--dkgreen)}

.actions{position:fixed; left:0; right:0; bottom:0; padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px)); background:linear-gradient(transparent, var(--paper) 30%)}
.actions-inner{display:flex; gap:10px; width:100%; max-width:560px; margin:0 auto}
.btn{flex:1; padding:16px 20px; border-radius:999px; border:0; background:var(--dkgreen); color:#fff; font-weight:700; font-size:18px; cursor:pointer}
.btn:disabled{opacity:.35; cursor:not-allowed}
.btn.ghost{flex:0 0 auto; background:transparent; color:var(--ink); border:2px solid var(--line)}
.btn.primary{background:var(--dkgreen)}

.thanks{padding-top:24px}
.thanks .big{font-size:72px; line-height:1; display:inline-block; margin-bottom:10px; animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-20deg); opacity:0}}
.err{background:color-mix(in srgb, var(--red) 10%, var(--card)); border:2px solid var(--red); padding:12px 14px; border-radius:14px; margin-top:14px; font-size:16px}
.demo-flag{background:var(--dkgreen); color:#fff; font-size:14px; font-weight:700; padding:6px 20px}

/* Admin */
.admin main{max-width:1100px}
.admin .top-row{max-width:1100px}
.filters{display:flex; flex-wrap:wrap; gap:10px; margin:0 0 18px}
.filters select,.filters input{padding:10px 12px; border:2px solid var(--line); border-radius:12px; background:var(--card)}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:22px}
.stat{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:14px}
.stat b{display:block; font-size:32px; line-height:1.1; color:var(--dkgreen)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .stat b{color:var(--green)} }
.stat span{color:var(--muted); font-size:15px}
.entries{display:grid; gap:12px}
.entry{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:16px}
.entry header{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px}
.tag{font-size:14px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--green); color:var(--dkgreen)}
.tag.g{background:var(--dkgreen); color:#fff}
.entry time{color:var(--muted); font-size:15px; margin-left:auto}
.ans{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:4px 16px; font-size:16px; margin-bottom:10px}
.ans div span{color:var(--muted)}
.entry blockquote{margin:0 0 10px; padding:10px 14px; border-left:4px solid var(--green); background:var(--tint); border-radius:0 10px 10px 0; white-space:pre-wrap}
.entry audio{width:100%; max-width:360px}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px}
.toolbar .btn{flex:0 0 auto; padding:11px 18px; font-size:16px}
.empty{color:var(--muted); padding:50px 0}
</style>

/* ============================================================
   STORAGE — Google Sheet + Drive via Apps Script; localStorage in demo
   ============================================================ */
const LIVE = !!CONFIG.scriptUrl;
const DEMO_KEY = "ppfb-demo-v1";

function uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==="x"?r:(r&3|8)).toString(16)})); }
function blobToDataURL(b){ return new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); }); }
function demoRead(){ try{ return JSON.parse(localStorage.getItem(DEMO_KEY)||"[]"); }catch(e){ return []; } }
function demoWrite(rows){ try{ localStorage.setItem(DEMO_KEY, JSON.stringify(rows)); }catch(e){ throw new Error("Demo storage full"); } }

// text/plain keeps this a "simple" request, so the browser doesn't need CORS preflight.
async function callScript(payload){
  const res = await fetch(CONFIG.scriptUrl, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const out = await res.json();
  if (!out.ok) throw new Error(out.error || "Rejected");
  return out;
}

const CODE_KEY = "ppfb-code";
const QUICK_LABEL = "Quick feedback";
function savedCode(){ try{ return localStorage.getItem(CODE_KEY)||""; }catch(e){ return ""; } }
async function checkCode(code){
  if (!LIVE) return code.trim().length>0;
  try{ await callScript({ action:"check", code: code.trim() }); return true; }catch(e){ return false; }
}

// Turns the answers into readable [column, value] pairs for the Sheet.
function sheetColumns(rec){
  const role = CONFIG.roles.find(r=>r.id===rec.role);
  const cols = []; if (!role) return cols;
  role.questions.forEach(q=>{
    let v = rec.answers[q.id];
    if (v!=null && q.options){
      const lab = id => q.options.find(o=>o.id===id)?.en || id;
      v = Array.isArray(v) ? v.map(lab).join(", ") : lab(v);
    }
    cols.push([q.q.en, v ?? ""]);
  });
  return cols;
}

async function saveFeedback(rec, voice, photos){
  if (!LIVE){
    const row = {...rec, created_at:new Date().toISOString(),
      voice_url: voice ? await blobToDataURL(voice.blob) : null,
      photo_urls: await Promise.all(photos.map(p=>blobToDataURL(p.blob)))};
    const rows = demoRead(); rows.unshift(row); demoWrite(rows); return;
  }
  const b64 = async blob => (await blobToDataURL(blob)).split(",")[1];
  const role = CONFIG.roles.find(r=>r.id===rec.role);
  await callScript({
    action: "submit",
    code: state.code,
    id: rec.id,
    tab: role?.label.en || QUICK_LABEL,
    site: CONFIG.sites.find(s=>s.id===rec.site)?.name.en || rec.site || "",
    lang: rec.lang,
    columns: sheetColumns(rec),
    comment: rec.comment || "",
    name: rec.contact_name || "", email: rec.contact_email || "", followUp: !!rec.contact_consent,
    voice: voice ? { mime: voice.blob.type, ext: voice.ext, data: await b64(voice.blob) } : null,
    photos: await Promise.all(photos.map(async p=>({ mime:"image/jpeg", data: await b64(p.blob) })))
  });
}

async function compressImage(file, max=1600){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const scale = Math.min(1, max/Math.max(img.width,img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
  } finally { URL.revokeObjectURL(url); }
}

const fresh = () => ({
  lang: (navigator.language||"en").toLowerCase().startsWith("de") ? "de" : "en",
  step: "welcome", qi: 0, mode: "survey",
  role: CONFIG.roles.find(r=>r.id===params.get("role")) || null,
  site: CONFIG.sites.find(s=>s.id===params.get("site")) || (CONFIG.sites.length===1 ? CONFIG.sites[0] : null),
  answers: {}, comment: "", voice: null, photos: [],
  name: "", email: "", consent: false, sending: false, error: "",
  code: savedCode(), codeInput: "", checking: false
});
let state = fresh();
let recorder = null, recChunks = [], recTimer = null, recStart = 0;

function steps(){
  const s = ["welcome"];
  if (CONFIG.requireCode && !state.code) s.push("code");
  if (state.mode==="quick"){ s.push("postcard"); return s; }
  if (!(params.get("role") && state.role)) s.push("role");
  if (!(params.get("site") && state.site) && CONFIG.sites.length>1) s.push("site");
  (state.role?.questions||[]).forEach((_,i)=>s.push("q"+i));
  s.push("postcard","contact");
  return s;
}
function cur(){ return state.step==="q" ? "q"+state.qi : state.step; }
function go(delta){
  let s = steps(); let i = s.indexOf(cur());
  if (i<0 && state.step==="code"){ s = steps(); i = 0; } const n = s[Math.max(0,Math.min(s.length-1,i+delta))];
  if (n.startsWith("q")){ state.step="q"; state.qi=+n.slice(1); } else state.step=n;
  render(); window.scrollTo({top:0});
}

    </div></div>
    ${progress!=null?`<div class="progress" aria-hidden="true"><span style="width:${progress}%"></span></div>`:""}
  </header>`;
}
function actions(nextLabel, nextEnabled=true, showBack=true, primary=false){
  const t = T[state.lang];

    ${showBack?`<button class="btn ghost" data-act="back">${t.back}</button>`:""}
    <button class="btn ${primary?"primary":""}" data-act="next" ${nextEnabled?"":"disabled"}>${nextLabel}</button>
  </div></div>`;
}

async function startRec(){
  const t = T[state.lang]; state.error="";
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mime = ["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
    recorder = new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
    recChunks = [];
    recorder.ondataavailable = e=>e.data.size && recChunks.push(e.data);
    recorder.onstop = ()=>{
      stream.getTracks().forEach(tr=>tr.stop());
      const blob = new Blob(recChunks,{type:recorder.mimeType||"audio/webm"});
      const ext = blob.type.includes("mp4")?"m4a":"webm";
      if (state.voice) URL.revokeObjectURL(state.voice.url);
      state.voice = {blob, ext, url:URL.createObjectURL(blob)};
      recorder = null; clearInterval(recTimer); render();
    };
    recorder.start(); recStart = Date.now(); render();
    recTimer = setInterval(()=>{
      const s = Math.floor((Date.now()-recStart)/1000);
      const el = $("#rectime"); if (el) el.textContent = `${t.stop} · ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
      if (s>=CONFIG.maxVoiceSeconds) recorder?.stop();
    },500);
  }catch(e){ state.error = t.micBlocked; recorder=null; render(); }
}

async function submit(){
  const t = T[state.lang];
  const quick = state.mode==="quick";
  if (quick && !state.comment.trim() && !state.voice && !state.photos.length){ state.error = t.quickEmpty; render(); return; }
  state.sending = true; state.error = ""; render();
  const rec = {
    id: uuid(), site: state.site?.id || null, role: quick ? "quick" : state.role.id, lang: state.lang,
    answers: quick ? {} : state.answers, comment: state.comment.trim() || null,
    contact_name: state.name.trim() || null, contact_email: state.email.trim() || null,
    contact_consent: state.consent, user_agent: navigator.userAgent.slice(0,200)
  };
  try{
    await saveFeedback(rec, state.voice, state.photos);
    state.sending=false; state.step="thanks"; render();
  }catch(e){ console.error(e); state.sending=false; state.error=t.failed; render(); }
}

function wireFlow(){
  document.addEventListener("click", async e=>{
    if (location.hash==="#admin") return;
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.lang){ state.lang=b.dataset.lang; render(); return; }
    if (b.dataset.mode){ state.mode=b.dataset.mode; go(1); return; }
    if (b.dataset.role){
      const r = CONFIG.roles.find(x=>x.id===b.dataset.role);
      if (state.role?.id!==r.id){ state.role=r; state.answers={}; }
      if (state.step==="welcome"){ state.step="role"; }
      go(1); return;
    }
    if (b.dataset.qsite){ state.site = state.site?.id===b.dataset.qsite ? null : CONFIG.sites.find(x=>x.id===b.dataset.qsite); render(); return; }
    if (b.dataset.site){ state.site = CONFIG.sites.find(x=>x.id===b.dataset.site); render(); setTimeout(()=>go(1),180); return; }
    if (b.dataset.val!=null && state.step==="q"){
      const q = state.role.questions[state.qi];
      const v = (q.type==="rating"||q.type==="nps") ? +b.dataset.val : b.dataset.val;
      state.answers[q.id]=v; render(); setTimeout(()=>go(1),220); return;
    }
    if (b.dataset.multi){
      const q = state.role.questions[state.qi]; const set = new Set(state.answers[q.id]||[]);
      set.has(b.dataset.multi)?set.delete(b.dataset.multi):set.add(b.dataset.multi);
      state.answers[q.id]=[...set]; render(); return;
    }
    if (b.dataset.delphoto!=null){ const p=state.photos.splice(+b.dataset.delphoto,1)[0]; URL.revokeObjectURL(p.url); render(); return; }
    switch(b.dataset.act){
      case "back": go(-1); break;
      case "next":
        if (state.step==="contact" || (state.step==="postcard" && state.mode==="quick")){ submit(); }
        else if (state.step==="code"){
          state.checking=true; state.error=""; render();
          const ok = await checkCode(state.codeInput);
          state.checking=false;
          if (ok){ state.code=state.codeInput.trim(); try{ localStorage.setItem(CODE_KEY,state.code); }catch(e){} go(1); }
          else { state.error=T[state.lang].codeBad; render(); }
        }
        else go(1);
        break;
      case "rec": startRec(); break;
      case "stoprec": recorder?.stop(); break;
      case "delvoice": URL.revokeObjectURL(state.voice.url); state.voice=null; render(); break;
      case "photo": $("#photoInput").click(); break;
      case "again": state = {...fresh(), lang:state.lang}; render(); break;
    }
  });
  document.addEventListener("input", e=>{
    if (e.target.id==="comment") state.comment=e.target.value;
    if (e.target.id==="nm") state.name=e.target.value;
    if (e.target.id==="em") state.email=e.target.value;
    if (e.target.id==="code") state.codeInput=e.target.value;
  });
  document.addEventListener("change", async e=>{
    if (e.target.id==="cs") state.consent=e.target.checked;
    if (e.target.id==="photoInput"){
      const files = [...e.target.files].slice(0, CONFIG.maxPhotos - state.photos.length);
      for (const f of files){
        try{ const blob = await compressImage(f); state.photos.push({blob, url:URL.createObjectURL(blob)}); }catch(err){ console.warn(err); }
      }
      render();
    }
  });
}

const A = { rows: [], session: null, f: { site:"", role:"", from:"", to:"" }, msg:"" };
const roleName = id => CONFIG.roles.find(r=>r.id===id)?.label.en || (id==="quick" ? QUICK_LABEL : id);
const siteName = id => CONFIG.sites.find(s=>s.id===id)?.name.en || id || "—";
function qLabel(roleId,qid){ return CONFIG.roles.find(r=>r.id===roleId)?.questions.find(q=>q.id===qid)?.q.en || qid; }
function optLabel(roleId,qid,v){
  const q = CONFIG.roles.find(r=>r.id===roleId)?.questions.find(x=>x.id===qid);
  if (!q?.options) return v;
  const f = id => q.options.find(o=>o.id===id)?.en || id;
  return Array.isArray(v) ? v.map(f).join(", ") : f(v);
}

async function adminLoad(){
  if (!LIVE) A.rows = demoRead();
}

function filtered(){
  return A.rows.filter(r=>
    (!A.f.site || r.site===A.f.site) && (!A.f.role || r.role===A.f.role) &&
    (!A.f.from || r.created_at >= A.f.from) && (!A.f.to || r.created_at.slice(0,10) <= A.f.to));
}
function stats(rows){
  const avg = k => { const v = rows.map(r=>r.answers?.[k]).filter(x=>typeof x==="number"); return v.length ? (v.reduce((a,b)=>a+b,0)/v.length).toFixed(1) : "—"; };
  const ratingIds = new Set(CONFIG.roles.flatMap(r=>r.questions.filter(q=>q.type==="rating").map(q=>r.id+":"+q.id)));
  const allR = rows.flatMap(r=>Object.entries(r.answers||{}).filter(([k,v])=>ratingIds.has(r.role+":"+k)&&typeof v==="number").map(([,v])=>v));
  const overallAvg = allR.length ? (allR.reduce((a,b)=>a+b,0)/allR.length).toFixed(1) : "—";
  const nps = rows.map(r=>r.answers?.enps).filter(x=>typeof x==="number");
  const score = nps.length ? Math.round(((nps.filter(x=>x>=9).length - nps.filter(x=>x<=6).length)/nps.length)*100) : "—";
  return { n: rows.length, overall: overallAvg, nps: score, media: rows.filter(r=>r.voice_url||r.photo_urls?.length).length, contact: rows.filter(r=>r.contact_consent).length };
}

function csv(rows){
  const qids = [...new Set(CONFIG.roles.flatMap(r=>r.questions.map(q=>q.id)))];
  const head = ["created_at","site","role","lang",...qids,"comment","has_voice","photos","contact_name","contact_email","contact_consent"];
  const cell = v => `"${String(Array.isArray(v)?v.join("; "):(v??"")).replace(/"/g,'""')}"`;
  const lines = rows.map(r=>[r.created_at, siteName(r.site), roleName(r.role), r.lang, ...qids.map(q=>r.answers?.[q]), r.comment, !!(r.voice_url||r.voice_path), (r.photo_urls||r.photo_paths||[]).length, r.contact_name, r.contact_email, r.contact_consent].map(cell).join(","));
  return [head.join(","), ...lines].join("\n");
}

    <div class="filters">
      <select data-f="site" aria-label="Site"><option value="">All sites</option>${opt(CONFIG.sites.map(x=>[x.id,x.name.en]),A.f.site)}</select>
      <select data-f="role" aria-label="Stakeholder"><option value="">All groups</option>${opt([...CONFIG.roles.map(x=>[x.id,x.label.en]),["quick",QUICK_LABEL]],A.f.role)}</select>
      <input type="date" data-f="from" value="${A.f.from}" aria-label="From">
      <input type="date" data-f="to" value="${A.f.to}" aria-label="To">
    </div>
    <div class="stats">
      <div class="stat"><b>${s.n}</b><span>Responses</span></div>
      <div class="stat"><b>${s.overall}</b><span>Avg rating (of 5)</span></div>
      <div class="stat"><b>${s.nps}</b><span>Crew eNPS</span></div>
      <div class="stat"><b>${s.media}</b><span>With voice or photos</span></div>
      <div class="stat"><b>${s.contact}</b><span>Happy to be contacted</span></div>
    </div>
    <div class="toolbar"><button class="btn" data-a="csv">Download CSV</button><button class="btn ghost" data-a="refresh">Refresh</button></div>
    ${A.msg?`<div class="err">${esc(A.msg)}</div>`:""}
    <div class="entries">${rows.length ? rows.map(r=>`
      <article class="entry">
        <header><span class="tag">${esc(roleName(r.role))}</span><span class="tag g">${esc(siteName(r.site))}</span><span class="tag" style="background:var(--line);color:var(--ink)">${esc((r.lang||"").toUpperCase())}</span>
        <time>${new Date(r.created_at).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}</time></header>
        <div class="ans">${Object.entries(r.answers||{}).map(([k,v])=>`<div><span>${esc(qLabel(r.role,k))}</span> <b>${esc(optLabel(r.role,k,v))}</b></div>`).join("")}</div>
        ${r.comment?`<blockquote>${esc(r.comment)}</blockquote>`:""}
        ${r.voice_url?`<audio controls preload="none" src="${esc(r.voice_url)}"></audio>`:""}
        ${r.photo_urls?.length?`<div class="thumbs" style="margin-top:8px">${r.photo_urls.map(u=>`<a class="thumb" href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Feedback photo" loading="lazy"></a>`).join("")}</div>`:""}
        ${r.contact_consent&&(r.contact_name||r.contact_email)?`<p class="hint">Contact: ${esc(r.contact_name||"")} ${r.contact_email?`&lt;${esc(r.contact_email)}&gt;`:""}</p>`:""}
      </article>`).join("") : `<div class="empty">Nothing here yet. Share the link or stick a QR code on the staff noticeboard.</div>`}
    </div></main>`;
}

function wireAdmin(){
  document.addEventListener("click", async e=>{
    if (location.hash!=="#admin") return;
    const b = e.target.closest("[data-a]"); if (!b) return;
    const a = b.dataset.a;
    if (a==="csv"){
      const blob = new Blob(["\ufeff"+csv(filtered())],{type:"text/csv"});
      const link = document.createElement("a"); link.href=URL.createObjectURL(blob);
      link.download=`pp-munich-feedback-${new Date().toISOString().slice(0,10)}.csv`; link.click();
    }
    if (a==="refresh"){ A.msg=""; await adminLoad(); renderAdmin(); }
  });
  document.addEventListener("change", e=>{
    if (location.hash!=="#admin") return;
    const k = e.target.dataset?.f; if (!k) return; A.f[k]=e.target.value; renderAdmin();
  });
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  if (location.hash==="#admin"){
    await adminLoad(); renderAdmin();
  } else { document.body.classList.remove("admin"); render(); }
}
wireFlow(); wireAdmin();
window.addEventListener("hashchange", boot);
boot();
</script>
</body>
</html>
